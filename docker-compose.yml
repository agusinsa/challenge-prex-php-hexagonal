services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: giphy
      DB_USERNAME: giphy
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "php artisan passport:keys --force && php artisan migrate --force && php artisan serve --no-reload --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: giphy
      MYSQL_USER: giphy
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.10.0/24
